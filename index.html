<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Macro Market Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #050505;
      color: white;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding: 20px;
      border: 1px solid #222;
      background: #0b0b0b;
    }

    .header h1 {
      color: #00ff99;
      font-size: 32px;
    }

    .timestamp {
      color: #888;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .card {
      background: #0f0f0f;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 16px;
    }

    .card h2 {
      margin-bottom: 15px;
      color: #00d9ff;
      font-size: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px 4px;
      border-bottom: 1px solid #1f1f1f;
      text-align: right;
    }

    th:first-child,
    td:first-child {
      text-align: left;
    }

    .positive {
      color: #00ff99;
    }

    .negative {
      color: #ff5f5f;
    }

    .summary {
      margin-top: 20px;
      background: #111;
      border: 1px solid #222;
      padding: 20px;
      border-radius: 12px;
      font-size: 18px;
      color: #ffd966;
    }

    .chart-container {
      margin-top: 15px;
      height: 250px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>US MACRO TERMINAL</h1>
      <div class="timestamp" id="timestamp"></div>
    </div>

    <div>
      Live Macro Dashboard
    </div>
  </div>

  <div class="grid" id="dashboard"></div>

  <div class="summary" id="summary">
    Loading macro conditions...
  </div>

  <div class="card" style="margin-top:20px;">
    <h2>Yield Curve</h2>
    <div class="chart-container">
      <canvas id="yieldCurveChart"></canvas>
    </div>
  </div>

  <script>
    const API_KEY = "demo";

    const categories = {
      "Indices": {
        "S&P 500": "SPY",
        "Nasdaq": "QQQ",
        "Dow Jones": "DIA",
        "Russell 2000": "IWM"
      },

      "Volatility": {
        "VIX": "^VIX"
      },

      "Commodities": {
        "Gold": "GLD",
        "Silver": "SLV",
        "Oil": "USO",
        "Natural Gas": "UNG"
      },

      "Forex": {
        "EUR/USD": "EURUSD",
        "GBP/USD": "GBPUSD",
        "USD/JPY": "USDJPY"
      },

      "Bonds": {
        "5Y Treasury": "IEI",
        "7-10Y Treasury": "IEF",
        "20Y Treasury": "TLT",
        "Short Term Treasuries": "SHY"
      },

      "ETFs": {
        "Financials": "XLF",
        "Energy": "XLE",
        "Semiconductors": "SOXX",
        "Tech": "XLK"
      },

      "Crypto": {
        "Bitcoin": "BTCUSD",
        "Ethereum": "ETHUSD"
      }
    };

    async function fetchQuote(symbol) {
      try {
        const response = await fetch(
          `/api/market?symbol=${symbol}`
        );

        const data = await response.json();

        if (!data || !data[0]) {
          return null;
        }

        return {
          price: data[0].price,
          change: data[0].change,
          percent: data[0].changesPercentage
        };

      } catch (error) {
        return null;
      }
    }

    function createCard(title, rows) {
      const card = document.createElement("div");
      card.className = "card";

      let html = `
        <h2>${title}</h2>
        <table>
          <thead>
            <tr>
              <th>Asset</th>
              <th>Value</th>
              <th>Change</th>
              <th>%</th>
            </tr>
          </thead>
          <tbody>
      `;

      rows.forEach(row => {
        const cls = row.change >= 0 ? "positive" : "negative";

        html += `
          <tr>
            <td>${row.name}</td>
            <td>${row.price?.toFixed(2) ?? "N/A"}</td>
            <td class="${cls}">
              ${row.change?.toFixed(2) ?? "N/A"}
            </td>
            <td class="${cls}">
              ${row.percent?.toFixed(2) ?? "N/A"}%
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;

      card.innerHTML = html;
      return card;
    }

    let yieldChart;

    function renderYieldCurve() {
      const ctx = document.getElementById("yieldCurveChart");

      if (!ctx) return;

      if (yieldChart) {
        yieldChart.destroy();
      }

      yieldChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: ["3M", "2Y", "5Y", "10Y", "30Y"],
          datasets: [{
            label: "US Treasury Yield Curve",
            data: [4.35, 3.95, 4.02, 4.28, 4.75],
            tension: 0.3,
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              labels: {
                color: "white"
              }
            }
          },
          scales: {
            x: {
              ticks: {
                color: "white"
              },
              grid: {
                color: "#222"
              }
            },
            y: {
              ticks: {
                color: "white"
              },
              grid: {
                color: "#222"
              }
            }
          }
        }
      });
    }

    function generateSummary(snapshot) {
      let summary = [];

      const spx = snapshot["Indices"]?.[0]?.percent || 0;
      const vix = snapshot["Volatility"]?.[0]?.price || 0;

      if (spx > 0) {
        summary.push("Equities are trading risk-on");
      } else {
        summary.push("Equities are weakening");
      }

      if (vix < 18) {
        summary.push("Low market fear");
      } else if (vix < 25) {
        summary.push("Moderate volatility conditions");
      } else {
        summary.push("High volatility and stress");
      }

      summary.push("Macro dashboard updated live");

      document.getElementById("summary").innerText = summary.join(" | ");
    }

    async function buildDashboard() {
      const dashboard = document.getElementById("dashboard");
      dashboard.innerHTML = "";

      const snapshot = {};

      for (const [categoryName, assets] of Object.entries(categories)) {
        const rows = [];

        for (const [label, symbol] of Object.entries(assets)) {
          const data = await fetchQuote(symbol);

          rows.push({
            name: label,
            price: data?.price,
            change: data?.change,
            percent: data?.percent
          });
        }

        snapshot[categoryName] = rows;

        const card = createCard(categoryName, rows);
        dashboard.appendChild(card);
      }

      generateSummary(snapshot);
      renderYieldCurve();

      document.getElementById("timestamp").innerText =
        "Last Update: " + new Date().toLocaleString();
    }

    buildDashboard();

    //setInterval(buildDashboard, 30000);
  </script>
</body>
</html>
